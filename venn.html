<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Venn Şeması</title>

<style>
/* ANA SAYFA TEMASI */
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", "Trebuchet MS", sans-serif;
  color: white;

  background: radial-gradient(circle at 20% 20%, rgba(118,0,255,0.35), transparent 60%),
              radial-gradient(circle at 80% 70%, rgba(0,255,180,0.35), transparent 60%),
              #000000;

  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* DIŞ KUTU */
.container {
  position: relative;
  width: 450px;
  height: 450px;
}

/* DAİRELER */
.circle {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  position: absolute;
  opacity: 0.7;
}

/* RENKLER ve POZİSYON */
.pink {
  background-color: pink;
  top: 40px;
  left: 115px;
}

.blue {
  background-color: deepskyblue;
  top: 160px;
  left: 190px;
}

.yellow {
  background-color: gold;
  top: 160px;
  left: 40px;
}
</style>
</head>

<body>

<div class="container">
  <div class="circle pink"></div>
  <div class="circle blue"></div>
  <div class="circle yellow"></div>
</div>

</body>
</html>
