<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Hayvanlar</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    /* ÜST KÜÇÜK KART */
    .top-card {
        border: 2px solid #333;
        padding: 15px;
        margin-bottom: 25px;
        border-radius: 10px;
        max-width: 450px;       /* Kartı küçültür */
        margin-left: auto;
        margin-right: auto;
    }

    .top-card img {
        width: 70%;             /* Resmi küçültür */
        max-height: 230px;
        object-fit: cover;
        border-radius: 10px;
    }

    /* ALTTAKİ 3 KART */
    .row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
    }

    .small-card {
        flex: 1;
        border: 2px solid #444;
        padding: 10px;
        border-radius: 10px;
    }

    .small-card img {
        width: 100%;
        max-height: 200px;
        object-fit: cover;
        border-radius: 10px;
        margin-top: 10px;
    }

    button {
        margin: 5px;
        padding: 8px 14px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="container">

    <!-- ÜSTTEKİ TEK KÜÇÜK KART -->
    <div class="top-card">
        
        <img id="topImage">
    </div>

    <!-- ALTTAKİ 3 KART -->
    <div class="row">

        <div class="small-card">
            
            <button onclick="showImage(1)">Göster</button>
            <button onclick="hideImage(1)">Gizle</button>
            <img id="img1" style="display:none;">
        </div>

        <div class="small-card">
            
            <button onclick="showImage(2)">Göster</button>
            <button onclick="hideImage(2)">Gizle</button>
            <img id="img2" style="display:none;">
        </div>

        <div class="small-card">
            
            <button onclick="showImage(3)">Göster</button>
            <button onclick="hideImage(3)">Gizle</button>
            <img id="img3" style="display:none;">
        </div>

    </div>
</div>

<script>
    // Arka plan renklerini rastgele seçme
    function randomBackground() {
        const colors = ["#f2d7d5", "#d5f5e3", "#d6eaf8", "#f9e79f", "#f8c471", "#d2b4de", "#aed6f1"];
        document.body.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    }

    // 10 farklı hayvan fotoğrafı
    const animalImages = [
        "https://media.wired.com/photos/593261cab8eb31692072f129/3:2/w_2560%2Cc_limit/85120553.jpg",
        "https://hips.hearstapps.com/hmg-prod/images/headshot-of-giraffe-sabi-sands-game-reserve-royalty-free-image-1573571198.jpg?crop=1.00xw:0.667xh;0,0.0760xh",
        "https://cdn.thegreatprojects.com/thegreatprojects/images/0/a/a/0/b/0aa0b77077f9a49e118702fa96ba2ba1.jpg?width=364&height=364&format=jpg",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZqQsSCEvoMPz5M4_p8kVsjpoRdr_uVsMkrA&s",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSai8RgtuxwDITI_adHlTUbZ6W5jUG-Woildg&s",
        "https://varmentguard.com/uploads/permanent/963dbe2472d23882bf65f6fc5748ffbe.jpg",
        "https://media.wired.com/photos/65caa6f6f553745750c04769/3:2/w_2560%2Cc_limit/elephant-congo-science-GettyImages-630005418.jpg",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqa22WKJ7RjnegKkb4e9sJApbUqvttBSlIxQ&s",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4IoiZyX73T-6i59-D4zDKuGxGtnVHEdLUQA&s",
        "https://ichef.bbci.co.uk/images/ic/480xn/p06p0nss.jpg"
    ];

    // Rastgele bir link döndüren fonksiyon
    function getRandomAnimal() {
        return animalImages[Math.floor(Math.random() * animalImages.length)];
    }

    // ÜSTTEKİ kart için resim yükle
    document.getElementById("topImage").src = getRandomAnimal();

    // ALT KARTLAR: Göster/Gizle
    function showImage(id) {
        const img = document.getElementById("img" + id);
        img.src = getRandomAnimal();
        img.style.display = "block";
    }

    function hideImage(id) {
        document.getElementById("img" + id).style.display = "none";
    }

    // Arka plan rengini her yenilemede değiştir
    randomBackground();
</script>

</body>
</html>
