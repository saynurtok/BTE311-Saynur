      background: radial-gradient(circle at 20% 20%, rgba(118,0,255,0.35), transparent 60%),

      background-attachment: fixed;
    }

    header {
      text-align: center;
      padding: 32px 0;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 2px;

    /* ---- CONTAINER ---- */
    .container {
      width: 55%;

      min-width: 300px;
      margin: 40px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---- WEEK CARD ---- */
    .week-box {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      padding: 22px;
      margin-bottom: 28px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.3s;
      width: 85%;

    .week-box:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
    }

    .week-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #d8d8d8;
      border-left: 5px solid #8a5eff;
      padding-left: 12px;
      text-align: left;
    }

    /* ---- LINKS ---- */
    a {
      display: block;
      padding: 10px 0;
      text-decoration: none;
      font-size: 17px;
      color: #d9d9d9;
      transition: 0.25s;
      position: relative;
    }

    a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0%;
      height: 2px;
      background: linear-gradient(90deg, #7c4dff, #00ffcc);

    a:hover {

    }

    a:hover::after {

    footer {
