<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Taş Kağıt Makas</title>
<style>

/* ANA TEMA */
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  color: white;
  background: radial-gradient(circle at 20% 20%, rgba(118,0,255,0.35), transparent 60%),
              radial-gradient(circle at 80% 70%, rgba(0,255,180,0.35), transparent 60%),
              #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* OYUN */
.container {
  width: 800px;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 0 25px rgba(0,0,0,0.5);
  text-align: center;
  position: relative;
}

h1 { text-shadow: 0 0 15px rgba(255,255,255,0.2); }

/* İSİM */
#nameScreen input {
  padding: 12px;
  width: 60%;
  border-radius: 10px;
  border: none;
}

#nameScreen button {
  margin-top: 15px;
  padding: 10px 20px;
  border-radius: 10px;
  background: linear-gradient(90deg,#7c4dff,#00ffcc);
  border: none;
  cursor: pointer;
}

/* OYUN ALANI */
.game { display: none; }

.players {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.playerBox {
  width: 220px;
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 15px;
}

/* BUTONLAR */
.choiceBtn {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  font-size: 36px;
  margin: 15px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.2);
  transition: 0.3s;
}

.choiceBtn:hover { transform: scale(1.2); }

/* SHAKE */
.shake {
  animation: shake 0.4s;
}

@keyframes shake {
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-5px)}
  100%{transform:translateX(0)}
}

/* SONUÇ */
#result { font-size: 18px; margin-top: 10px; }

/* BUTONLAR */
button { cursor: pointer; }

.controls {
  margin-top: 20px;
}

.reset, .restart {
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  margin: 5px;
}

.reset { background:#dc2626; color:white;}
.restart { background:#16a34a; color:white;}

/* POPUP */
.overlay {
  display: none;
  position:absolute;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.55);
  justify-content:center;
  align-items:center;
}

.popup {
  padding:30px;
  border-radius:20px;
  font-size:28px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
}

.win { color:#16ffb5; }
.lose { color:#ff4d6d; }
.draw { color:#4dc3ff; }

</style>
</head>
<body>

<div class="container">

<div class="overlay" id="overlay">
  <div class="popup" id="popupText"></div>
</div>

<div id="nameScreen">
  <h1>🎮 Taş Kağıt Makas</h1>
  <input type="text" id="username" placeholder="İsmini gir">
  <br>
  <button onclick="startGame()">Başla</button>
</div>

<div class="game" id="gameScreen">

<div class="players">
  <div class="playerBox">
    <div id="playerName"></div>
    Skor: <span id="playerScore">0</span>
  </div>
  <div class="playerBox">
    Saynur<br>
    Skor: <span id="computerScore">0</span>
  </div>
</div>

<h3>Hamleni seç</h3>

<div class="choices">
  <button class="choiceBtn" onclick="play('tas')">✊</button>
  <button class="choiceBtn" onclick="play('makas')">✌️</button>
  <button class="choiceBtn" onclick="play('kagit')">✋</button>
</div>

<div id="computerChoice"></div>
<div id="result"></div>

<div class="controls">
  <button class="restart" onclick="restartGame()">Yeniden Başlat</button>
  <button class="reset" onclick="resetGame()">Sıfırla</button>
</div>

</div>

</div>

<script>

let user="";
let playerScore=0;
let computerScore=0;
let round=0;
const maxRound=5;

function startGame(){
  const name=document.getElementById("username").value;
  if(name===""){alert("İsmini gir!");return;}
  user=name;
  document.getElementById("playerName").innerText=user;
  document.getElementById("nameScreen").style.display="none";
  document.getElementById("gameScreen").style.display="block";
}

function play(player){
  if(round>=maxRound) return;

  const comp = ["tas","kagit","makas"][Math.floor(Math.random()*3)];
  round++;

  const compText = document.getElementById("computerChoice");
  compText.innerText = "Saynur'un hamlesi: " + emoji(comp);
  compText.classList.add("shake");
  setTimeout(()=>compText.classList.remove("shake"),200);

  if(player===comp){}
  else if((player=="tas"&&comp=="makas") ||
          (player=="kagit"&&comp=="tas") ||
          (player=="makas"&&comp=="kagit")) playerScore++;
  else computerScore++;

  updateScores();
  document.getElementById("result").innerText="Tur: "+round+" / 5";

  if(round===maxRound) finish();
}

function finish(){
  const overlay=document.getElementById("overlay");
  const popup=document.getElementById("popupText");

  if(playerScore>computerScore){
    popup.innerText="🏆 KAZANDIN!";
    popup.className="popup win";
  }
  else if(computerScore>playerScore){
    popup.innerText="😢 KAYBETTİN!";
    popup.className="popup lose";
  }
  else{
    popup.innerText="🤝 BERABERE!";
    popup.className="popup draw";
  }

  overlay.style.display="flex";
}

function updateScores(){
  document.getElementById("playerScore").innerText=playerScore;
  document.getElementById("computerScore").innerText=computerScore;
}

function emoji(c){
  if(c=="tas") return "✊";
  if(c=="kagit") return "✋";
  return "✌️";
}

function restartGame(){
  round=0;
  playerScore=0;
  computerScore=0;
  updateScores();
  document.getElementById("result").innerText="";
  document.getElementById("computerChoice").innerText="";
  document.getElementById("overlay").style.display="none";
}

function resetGame(){
  restartGame();
  document.getElementById("username").value="";
  document.getElementById("nameScreen").style.display="block";
  document.getElementById("gameScreen").style.display="none";
}

</script>

</body>
</html>
