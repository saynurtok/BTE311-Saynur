<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taş Kağıt Makas Oyunu</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
    #game { margin: auto; max-width: 400px; }
    .choice { padding: 15px 25px; margin: 5px; font-size: 18px; cursor: pointer; }
    #result { margin-top: 20px; font-size: 20px; }
    #score { margin-top: 15px; font-size: 18px; }
    #reset { margin-top: 20px; padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Taş – Kağıt – Makas</h1>
  <div id="game">
    <button class="choice" data-choice="tas">Taş</button>
    <button class="choice" data-choice="kagit">Kağıt</button>
    <button class="choice" data-choice="makas">Makas</button>

    <div id="result">Bir seçenek yapınca oyun başlar...</div>
    <div id="score">Oyuncu: 0 – Bilgisayar: 0 (İlk 5 kazanana)</div>

    <button id="reset">Sıfırla / Yeni Oyun</button>
  </div>

  <script>
    const choices = ["tas", "kagit", "makas"];
    let playerScore = 0;
    let computerScore = 0;

    const resultDiv = document.getElementById("result");
    const scoreDiv = document.getElementById("score");
    const resetBtn = document.getElementById("reset");
    const buttons = document.querySelectorAll(".choice");

    function getComputerChoice(){
      const idx = Math.floor(Math.random() * 3);
      return choices[idx];
    }

    function checkWinner(p, c){
      if (p === c) return "berabere";
      if (
        (p === "tas" && c === "makas") ||
        (p === "kagit" && c === "tas") ||
        (p === "makas" && c === "kagit")
      ) return "player";
      return "computer";
    }

    function updateResult(p, c, winner){
      if (winner === "berabere"){
        resultDiv.innerText = `Berabere! Sen: ${p}, Bilgisayar: ${c}`;
      } else if (winner === "player"){
        playerScore++;
        resultDiv.innerText = `Kazandın! Sen: ${p}, Bilgisayar: ${c}`;
      } else {
        computerScore++;
        resultDiv.innerText = `Kaybettin :(( Sen: ${p}, Bilgisayar: ${c}`;
      }
      scoreDiv.innerText = `Oyuncu: ${playerScore} – Bilgisayar: ${computerScore} (İlk 5 kazanana)`;
      checkEnd();
    }

    function checkEnd(){
      if (playerScore === 5 || computerScore === 5){
        if (playerScore > computerScore){
          resultDiv.innerText = "🎉 Tebrikler! Seriyi kazandın!";
        } else {
          resultDiv.innerText = "Bilgisayar kazandı 😢 Seriyi kaybettin.";
        }
        buttons.forEach(b => b.disabled = true);
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        const playerChoice = btn.dataset.choice;
        const compChoice = getComputerChoice();
        const winner = checkWinner(playerChoice, compChoice);
        updateResult(playerChoice, compChoice, winner);
      });
    });

    resetBtn.addEventListener("click", () => {
      playerScore = 0;
      computerScore = 0;
      resultDiv.innerText = "Yeni oyun hazır. Seçimini yap!";
      scoreDiv.innerText = `Oyuncu: 0 – Bilgisayar: 0 (İlk 5 kazanana)`;
      buttons.forEach(b => b.disabled = false);
    });
  </script>
</body>
</html>
